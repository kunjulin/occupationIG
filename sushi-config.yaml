id: mohw.tw.twha
canonical: https://twcore.mohw.gov.tw/ig/twha
name: TWHAIG
title: 臺灣勞工健康檢查交換實作指引 (Taiwan Labor Health Examination Exchange FHIR IG, TWHA IG)
description: 以勞工健康檢查為核心之 FHIR 資料交換標準，繼承臺灣核心實作指引 (TW Core IG)，並可向特殊職類與一般健康檢查／成人預防保健需求擴充。【canonical 為 provisional：正式命名空間之核定機關與命名尚待確認，宜先定治理再定 namespace。】
status: active
version: 0.7.3
# 本指引之敘述性內容為繁體中文（臺灣）。未宣告時 IG Publisher 會預設為 en，
# 導致整份中文內容被標記為 lang="en" 並輸出至 en/ 子目錄（JOB-02）。
language: zh-TW
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: STU1
publisher:
  name: 衛生福利部次世代數位醫療平臺專案辦公室 & 長庚醫療財團法人長庚紀念醫院
  url: https://twcore.mohw.gov.tw/twregistry/
contact:
  - name: 衛生福利部次世代數位醫療平臺專案辦公室
    telecom:
      - system: url
        value: https://twcore.mohw.gov.tw/twregistry/
dependencies:
  tw.gov.mohw.twcore: 1.0.0
  # 臺灣癌症登記短表實作指引（TWCR_SF）——嚼檳榔行為之代碼系統與值集來源（JOB-28）。
  #
  # 本 IG 之 TWHA-SocialHistory-BetelNut 採 TWCR_SF 之元件架構與值集（required 綁定），
  # 以便與癌症登記語意一致。0.2.5 以前因上游不可達，改以本地 stub 承載（JOB-10 路徑 B）。
  #
  # 2026-08-20 重新查證（JOB-28 §1）：上游 IG 站台實際位於 mitw.dicom.org.tw，
  # 而非先前僅探測之 hapi.fhir.tw（後者為 canonical 命名空間，不負責託管）：
  #   站台   https://mitw.dicom.org.tw/IG/TWCR_SF/          v0.1.1（2024-08-01 建置）
  #   套件   https://mitw.dicom.org.tw/IG/TWCR_SF/package.tgz   HTTP 200，734 KB
  #   狀態   status = active、experimental = false、content = complete、授權 CC0-1.0
  #   代碼   sf-BetNutChewAmount 上游 94 碼，與本地 stub 94 碼一致
  # 故改採 JOB-10 路徑 A，刪除本地 stub。
  #
  # ⚠️ 套件仍未上架任何公開 registry（fhir.twcrsf／fhir.TWCRSF 大小寫皆 404），
  #    故 CI 須先自 IG 站台下載 package.tgz 解入 FHIR 套件快取，見
  #    .github/workflows/build-ig.yml 之「Fetch TWCR_SF package」步驟。
  fhir.TWCRSF:
    version: 0.1.1
    uri: https://hapi.fhir.tw/fhir/ImplementationGuide/fhir.TWCRSF

parameters:
  # 預設翻譯語言。這才是決定輸出語言目錄名稱的參數。
  #
  # 僅設 IG 層級的 `language: zh-TW`（見上）不足以改變輸出目錄——實測 CI 建置後
  # 內容仍落在 output/en/。IG Publisher 之 PublisherIGLoader 讀取的是本參數
  # （對應其 defaultTranslationLang 欄位），`i18n-lang` 則用於追加其他語言。
  # 兩者並存：`language` 宣告 ImplementationGuide 資源本身的語言，
  # `i18n-default-lang` 宣告產出頁面的預設語言。
  i18n-default-lang: zh-TW
  # 當同一 canonical 於多個套件中有不同版本時，將參照釘定至實際採用的版本。
  # 未設定時 IG Publisher 逐筆警告「There are multiple different potential matches」
  # （2026-07-26 基準線 29 筆），且實作端可能解析到非預期版本之定義。
  # 取值為 PublisherUtils$PinningPolicy：pin-none／pin-multiples／pin-all。
  # 採 pin-multiples——僅在確有多版本衝突時釘定，不對其餘參照加註版本。
  pin-canonicals: pin-multiples
  # 版本歷程頁位址。未設定時 IG Publisher 以 canonical + /history.html 推導，
  # 即 https://twcore.mohw.gov.tw/ig/twha/history.html —— 該站尚未建立，故連結必然 404。
  # 本草案以 GitHub Pages 供審閱，故指向實際可達位址；正式發佈於 twcore.mohw.gov.tw
  # 後應改回官方站並改由 HL7 發佈流程依 package-list.json 產生 history.html。
  path-history: https://kunjulin.github.io/occupationIG/history.html
  # special-url 已於 0.3.0 移除（JOB-28）。
  # 原列 9 個 hapi.fhir.tw（TWCR_SF）canonical，係本地 stub 時期為容許他方命名空間
  # 出現於本 IG 產出而設之例外。改為正式 dependencies 後，該等 canonical 由上游套件
  # 提供，不再需要例外宣告。scripts/check-dependencies.js 之 D-3 禁止其復現。

  # no-validate：排除於驗證之外的值集。逐項理由如下（JOB-26 補列）。
  #
  # 0.2.5 以前本區塊之**原始理由未見於任何文件或 commit 訊息**，而這六個正是本 IG 的
  # 核心術語資產，無理由的排除會削弱「0 Error」的說服力。JOB-01（術語稽核，
  # Wrong Display Name 133→0）與 JOB-19／20（UCUM 與 Scale 稽核）完成後已具備重評基礎，
  # 故本版逐項寫明理由，並依實際情形分為兩類：
  #
  # 【A】有實質理由，應長期保留 —— 1 個
  #   VS-UnfitDiseases
  #     其定義為 `include codes from system ICD10CM`，即**意向式引用整個 ICD-10-CM
  #     代碼系統**（附表十二不適作業疾病，以 ICD-10-CM 表示）。此類 intensional include
  #     須由術語伺服器展開整個外部代碼系統，展開量極大且相依於 tx 端是否服務 ICD-10-CM。
  #     這是 no-validate 的正當用途，非權宜之計。
  #
  # 【B】已具備移除條件，惟須先量測 —— 5 個
  #   VS-CoreDataset（10 檢驗項＋acceptable）、VS-ExtendedDataset（288 碼）、
  #   VS-OccHealthCheck-Required（22 碼）、VS-PulmonaryFunction（9 碼）、
  #   VS-TWHAVitalSigns（生理量測）
  #     五者均為**逐碼列舉**之 LOINC／SNOMED 清單，且已通過 JOB-01 顯示名稽核
  #     （Wrong Display Name = 0）與 JOB-19／20 之 UCUM／Scale 稽核。
  #
  # ⚠️ **本版不逕行移除【B】**。移除後可能一次浮出大量訊息，而本專案之既定原則是
  #    **不憑猜測寫入、不預先猜測 QA 數字**（同 JOB-09 對模板釘版之裁示）。
  #    改為在 CI 提供實驗開關：workflow_dispatch 之 `drop-no-validate` 輸入設為 true 時，
  #    建置前移除【B】五項並照常產出 qa.txt，即可取得實測訊息數作為決策依據。
  #    取得實測值後另以一次版本變更移除，屆時本區塊僅餘 VS-UnfitDiseases。
  #    此項續掛於未決事項 T-6。
  no-validate:
    - https://twcore.mohw.gov.tw/ig/twha/ValueSet/VS-CoreDataset
    - https://twcore.mohw.gov.tw/ig/twha/ValueSet/VS-ExtendedDataset
    - https://twcore.mohw.gov.tw/ig/twha/ValueSet/VS-OccHealthCheck-Required
    - https://twcore.mohw.gov.tw/ig/twha/ValueSet/VS-PulmonaryFunction
    - https://twcore.mohw.gov.tw/ig/twha/ValueSet/VS-TWHAVitalSigns
    - https://twcore.mohw.gov.tw/ig/twha/ValueSet/VS-UnfitDiseases

# 頁面標題（JOB-25，0.2.5）。
#
# 未宣告 `pages:` 時，SUSHI 會自動收錄 input/pagecontent/*.md 全部檔案，並以
# 「檔名去副檔名後轉 Title Case」推導頁面標題——general-exam.md -> "General Exam"、
# index.md -> "Home"。該標題寫入 ImplementationGuide.definition.page.title，
# 再由模板填入 <title>、頁首 H1 與麵包屑，導致全站標題為英文
# （2026-08-17 已發佈站台 v0.2.4 實測）。TW Core 對應位置為中文。
#
# ⚠️ 宣告 `pages:` 後 SUSHI 即停止自動收錄——**未列於此處的 pagecontent 檔案會從
#    建置產出中靜默消失，且不會有任何錯誤訊息**。故 scripts/check-menu.js 新增 R-6：
#    pagecontent 檔案與本區塊須雙向對應（漏列即 exit 1）。新增頁面時兩處都要加。
#
# 排列順序同時決定 toc.html 之章節順序，故刻意排成與 menu 一致。
pages:
  index.md:
    title: 應用說明
  quickstart.md:
    title: 快速入門
  background.md:
    title: 計畫背景
  usecases.md:
    title: 應用案例
  datamodel.md:
    title: 資料模型
  profiles-and-extensions.md:
    title: Profiles 與 Extensions
  terminology.md:
    title: 術語與代碼系統
  conformance.md:
    title: 遵從性與依賴
  general-exam.md:
    title: 一般健康檢查
  special-exam.md:
    title: 特殊危害健康作業
  adult-preventive-care.md:
    title: 成人預防保健
  service-record.md:
    title: 勞工健康服務執行紀錄
  health-management.md:
    title: 健康管理分級與配工
  examples.md:
    title: 範例
  downloads.md:
    title: 結構定義與範例檔下載
  security.md:
    title: 安全與個資保護
  ip-statements.md:
    title: 智慧財產權聲明
  open-issues.md:
    title: 已知限制與試用須知
  history.md:
    title: 版本歷程

# 導覽列（JOB-23，0.2.3）。頂層 8 項，排列邏輯比照 TW Core IG v1.0.0 之
# 「文件類型導向」：應用說明 → 目錄 → 規範文件 → 範例 → 下載 → 安全性。
#
# 三條不得違反之約束（由 scripts/check-menu.js 於 CI 強制，見 JOB-23 §5）：
#   1. 不得出現 `artifacts.html#<數字>`。該錨點由 IG Publisher 依「該次建置實際存在的
#      artifact 類別」自動編號，新增或移除任一類別即整體位移，導覽連結會靜默指向
#      錯誤區段，且 err = 0 仍成立（Publisher 不檢查頁內錨點語意）。改以策展頁
#      profiles-and-extensions.html 與 terminology.html 承接。
#   2. 不得更動既有 pagecontent 檔名。委員意見書、簡報與既發函文已引用現行網址。
#   3. 頂層標籤為純中文（比照 TW Core）；英文名稱保留於各頁 H1。
menu:
  應用說明:
    導言與整體架構: index.html
    快速入門: quickstart.html
    計畫背景: background.html
    應用案例: usecases.html
  目錄: toc.html
  規範文件:
    資源總覽: artifacts.html
    資料模型: datamodel.html
    Profiles 與 Extensions: profiles-and-extensions.html
    術語與代碼系統: terminology.html
    遵從性與依賴: conformance.html
  檢查與紀錄:
    一般健康檢查: general-exam.html
    特殊危害健康作業: special-exam.html
    成人預防保健: adult-preventive-care.html
    勞工健康服務執行紀錄: service-record.html
    健康管理分級與配工: health-management.html
  範例: examples.html
  結構定義與範例檔下載: downloads.html
  安全性:
    安全與個資保護: security.html
    智慧財產權聲明: ip-statements.html
  已知限制與試用須知: open-issues.html

