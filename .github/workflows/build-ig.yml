name: Build IG

# JOB-08：建置 ＋ QA 閘門 ＋ 發佈 gh-pages。
#
# 兩個 job：
#   build   — SUSHI → IG Publisher（帶 -tx）→ 佈局驗收 → QA 閘門。每個 PR 都跑。
#   publish — 把 build 產出的 site artifact 全量覆蓋至 gh-pages。**預設不會自動執行**，
#             見該 job 的 if 條件。
#
# 產出物（Artifacts）：qa.txt / qa.html / publisher 執行日誌，可從 Actions 頁面下載，
# 用來逐項驗收 JOB-02、JOB-03 之 §7 檢查清單。

on:
  # push 只掛 main：功能分支一旦開了 PR，push 與 pull_request 會各觸發一次，
  # 而本建置要 10–20 分鐘，重複執行純屬浪費。功能分支交由 pull_request 觸發。
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tx:
        description: '術語伺服器（n/a = 離線，不得作為送審依據）'
        required: false
        default: 'https://tx.fhir.org/r4'
      publisher-version:
        description: 'IG Publisher 版本（須與 qa-baseline.json 一致，否則 QA 數字不可比）'
        required: false
        default: '2.2.11'
      publish:
        description: '建置與閘門通過後，覆蓋發佈至 gh-pages（會清除現行網站）'
        type: boolean
        required: false
        default: false
      drop-no-validate:
        description: '【實驗用】建置前移除 no-validate 之【B】五項值集，量測實際浮出之訊息數（T-6）。不得用於發佈'
        type: boolean
        required: false
        default: false

# 同一分支的新 push 取消舊的執行；建置需 10–20 分鐘，避免排隊堆積。
concurrency:
  group: build-ig-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      publisher-version: ${{ steps.versions.outputs.publisher }}

    env:
      TX_SERVER: ${{ github.event.inputs.tx || 'https://tx.fhir.org/r4' }}
      IG_PUBLISHER_VERSION: ${{ github.event.inputs.publisher-version || '2.2.11' }}

    steps:
      - uses: actions/checkout@v4

      - name: Record versions
        id: versions
        run: echo "publisher=$IG_PUBLISHER_VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------- 快速檢查
      # 不需要建置就能跑的檢查放前面，讓明顯錯誤在 1 分鐘內就失敗。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check pagecontent references
        run: npm run check:refs

      # 導覽列閘門（JOB-23 §5）。check:refs 只檢查 pagecontent 內文，不涵蓋 menu。
      # 先跑負向測試再跑實檢：閘門本身失效時會「全綠但其實沒檢查」，故先證明它
      # 會攔下該攔的東西（比照 JOB-20／21／22 之作法），實檢結果才有意義。
      - name: Check navigation menu (self-test first)
        run: |
          npm run check:menu:selftest
          npm run check:menu

      # 外部相依閘門（JOB-28 §5）。TWCR_SF 之 9 個 artifact 於 0.3.0 由本地 stub 改為
      # 正式相依。此閘門固定該狀態：不得自行定義他方命名空間、不得復現 special-url
      # 例外、不得把已刪除的 stub 貼回來。CI 若抓不到套件，正確的修法是修取得步驟，
      # 不是還原成舊的權宜作法——那會靜默地退回「本 IG 自行定義他方資源」的狀態。
      - name: Check external dependencies (self-test first)
        run: |
          npm run check:deps:selftest
          npm run check:deps

      # ---------------------------------------------------------------- 建置環境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # IG Publisher 最終階段以 Jekyll 產生頁面，故 CI 必須具備 Ruby + Jekyll。
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll
        run: gem install jekyll bundler --no-document

      # FHIR 套件快取。未快取時每次建置都要重新抓 hl7.fhir.r4.core 等套件，
      # 會讓 CI 慢上數分鐘，也增加對 packages.fhir.org 的依賴。
      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: |
            fhir-packages-

      # TWCR_SF（fhir.TWCRSF#0.1.1）未上架任何公開 registry——2026-07-28 與 2026-08-20
      # 兩度實測，fhir.twcrsf／fhir.TWCRSF 大小寫於 packages.fhir.org、packages2.fhir.org、
      # packages.simplifier.net 皆 404。但其 IG 站台提供標準的 package.tgz，故自站台取得
      # 並解入 FHIR 套件快取，SUSHI 與 IG Publisher 即可如常解析（JOB-28 §4）。
      #
      # 置於 Cache FHIR packages 之後：快取命中時下載為 no-op（先檢查目錄是否已存在）。
      #
      # ⚠️ 大小寫：上游 package.json 之 name 為 fhir.TWCRSF（含大寫），但 SUSHI 會將套件 id
      #    正規化為小寫並印出 "fhir.TWCRSF contains uppercase characters ... SUSHI will use
      #    fhir.twcrsf"，因而只到 ~/.fhir/packages/fhir.twcrsf#<ver> 找。若僅解到原大小寫之
      #    目錄，SUSHI 會判定快取未命中而回頭連 registry（該套件未上架，必 404）並中止建置
      #    ——run 32346874349 即為此。故兩種大小寫之目錄都提供同一份套件：小寫供 SUSHI，
      #    原大小寫保留以對應上游宣告之 name 與 sushi-config 之相依鍵。
      - name: Fetch TWCR_SF package
        env:
          TWCRSF_VERSION: '0.1.1'
          TWCRSF_URL: 'https://mitw.dicom.org.tw/IG/TWCR_SF/package.tgz'
        run: |
          set -euo pipefail
          root="$HOME/.fhir/packages"
          dest="$root/fhir.TWCRSF#${TWCRSF_VERSION}"
          lower="$root/fhir.twcrsf#${TWCRSF_VERSION}"
          if [ -f "$dest/package/package.json" ]; then
            echo "快取已命中：$dest"
          else
            mkdir -p "$dest"
            echo "自 $TWCRSF_URL 下載…"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/twcrsf.tgz "$TWCRSF_URL"
            tar -xzf /tmp/twcrsf.tgz -C "$dest"
            # 驗證取得的確實是預期的套件與版本，而非錯誤頁或改版後的內容
            got_id=$(node -p "require('$dest/package/package.json').name")
            got_ver=$(node -p "require('$dest/package/package.json').version")
            echo "取得：$got_id#$got_ver"
            if [ "$got_id" != "fhir.TWCRSF" ] || [ "$got_ver" != "$TWCRSF_VERSION" ]; then
              echo "FAIL 套件與預期不符（期望 fhir.TWCRSF#${TWCRSF_VERSION}）"
              exit 1
            fi
            ls "$dest/package" | head -5
          fi
          # 小寫別名（SUSHI 實際查找的名稱）。以複本而非符號連結提供，避免快取打包／
          # 還原與套件管理器對連結之處理差異。
          if [ ! -f "$lower/package/package.json" ]; then
            rm -rf "$lower"
            cp -a "$dest" "$lower"
            echo "已另以小寫名稱提供同一份套件：$lower"
          fi
          # 驗證兩者皆就位——SUSHI 找不到就會回頭連 registry，而該套件未上架，必然失敗。
          for d in "$dest" "$lower"; do
            [ -f "$d/package/package.json" ] || { echo "FAIL 套件目錄缺失：$d"; exit 1; }
          done

      # 上游套件把「本套件渲染於何處」記成了建置者的本機 Windows 路徑
      # （file://C:\Users\Lily\TWCR_SF\output）。IG Publisher 以該基底組出本 IG
      # profile 敘述中指向 TWCR_SF 值集之連結，於 run 32347196173 產生 3 筆 ERROR：
      #
      #   StructureDefinition/TWHA-SocialHistory-BetelNut: StructureDefinition.text.div:
      #   The URL is not valid because '(URL contains 4 Invalid Characters: '\')':
      #   file://C:\Users\Lily\TWCR_SF\output/ValueSet-sf-BetNutChew{Amount,Year,Quit}-valueset.html
      #
      # 這是上游封裝之瑕疵，本 IG 無從於原始碼修正——但也不能不管：不修的話，本 IG
      # 發佈出去的 profile 頁面會帶著指向他人電腦的 file:// 連結。故於安裝階段將該基底
      # 改為上游站台實際位址，使連結指向真正的上游頁面。**只改渲染基底，不動任何定義。**
      #
      # ⚠️ 失敗設計：找不到可替換之處即中止。若上游改版修好了此問題，掃描會 0 命中，
      #    此時以「站台位址是否已存在」區分「已修好」與「假設失效」——後者必須讓 CI 紅，
      #    否則本步驟會靜默地什麼都沒做，而錯誤照樣出現在下一步。
      - name: Repair TWCR_SF rendering base
        env:
          TWCRSF_VERSION: '0.1.1'
          TWCRSF_SITE: 'https://mitw.dicom.org.tw/IG/TWCR_SF'
        run: |
          set -euo pipefail
          node - "$HOME/.fhir/packages/fhir.TWCRSF#${TWCRSF_VERSION}" \
                 "$HOME/.fhir/packages/fhir.twcrsf#${TWCRSF_VERSION}" <<'EOF'
          const fs = require('fs'), path = require('path');
          const SITE = process.env.TWCRSF_SITE;
          // 吃到 output 區段為止：file://C:\Users\Lily\TWCR_SF\output/X.html -> <SITE>/X.html
          const RE = /file:\/\/[^"'\s]*?output(?=[\\/]|["'\s]|$)/g;
          let replaced = 0, siteSeen = false, files = 0, root = '';
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).forEach((e) => {
            const p = path.join(d, e.name);
            if (e.isDirectory()) return walk(p);
            let s;
            try { s = fs.readFileSync(p, 'utf8'); } catch { return; }
            if (s.includes(SITE)) siteSeen = true;
            if (!s.includes('file://')) return;
            const hits = s.match(RE);
            if (!hits) return;
            fs.writeFileSync(p, s.replace(RE, SITE));
            replaced += hits.length; files += 1;
            console.log(`  ${path.relative(root, p)}：${hits.length} 處 → ${SITE}`);
            [...new Set(hits)].forEach((h) => console.log(`      原值 ${h}`));
          });
          process.argv.slice(2).forEach((r) => {
            root = r;
            if (!fs.existsSync(root)) { console.error(`FAIL 套件目錄不存在：${root}`); process.exit(1); }
            console.log(`掃描 ${root}`);
            walk(root);
          });
          console.log(`共改寫 ${replaced} 處，涉及 ${files} 個檔案。`);
          if (replaced === 0) {
            if (siteSeen) { console.log('0 命中，但站台位址已存在——判定先前已修復（快取命中），通過。'); }
            else {
              console.error('FAIL 掃描 0 命中且查無站台位址：上游封裝可能已改版，本步驟之假設失效。');
              console.error('     請重新檢視套件內容後更新本步驟，不要讓它靜默通過。');
              process.exit(1);
            }
          }
          EOF

      - name: Cache IG Publisher jar
        uses: actions/cache@v4
        with:
          path: input-cache/publisher.jar
          key: ig-publisher-${{ env.IG_PUBLISHER_VERSION }}

      # ---------------------------------------------------------------- 建置
      # downloads.md 對外提供之三個下載封包/試算表原為手工快照，實測落後數週：
      #   fsh-source.zip           宣稱「可直接以 SUSHI 重新編譯」，卻仍含舊版 examples.fsh
      #   loinc-valuesets.xlsx     停在重構前 Core/Extended 193/123 碼，含已移除之語意錯碼
      #   snomed-mappings.xlsx     eGFR 一列仍為舊碼 88293-6
      # 三者均改為建置時由值集/對照表產生（固定時間戳，位元組可重現）：
      #   scripts/build-fsh-source-zip.js（JOB-05）、scripts/build-download-xlsx.js（JOB-17）。
      # 此處只驗證提交進版控的那份與當前原始碼一致，改了值集卻忘了重建就擋下來。
      # 另含 ConceptMap equivalence 一致性檢查（JOB-22 §3.4）：comment 之方向敘述須與
      # equivalence 值相符。16 組方向顛倒之成因即「文件定義為 source-relative、R4 為
      # target-relative」；5 組 comment 矛盾則為 JOB-01 只修 display 未修 comment 之殘留。
      - name: Check downloadable assets are current
        run: npm run check:assets

      # T-6 實驗開關。預設不啟用；設為 true 時移除 no-validate 之【B】五項，
      # 讓該次建置的 qa.txt 顯示「若移除會浮出多少訊息」。這是取得決策依據的方式，
      # 取代憑猜測直接移除（本專案既定原則：不預先猜測 QA 數字）。
      # ⚠️ 此模式之產出不得用於發佈，亦不得據以更新 qa-baseline.json。
      - name: '[experiment] Drop no-validate group B'
        if: github.event.inputs.drop-no-validate == 'true'
        run: |
          set -euo pipefail
          echo "⚠️ 實驗模式：移除 no-validate 之【B】五項（T-6 量測用，非發佈用）"
          node - <<'EOF'
          const fs = require('fs');
          const B = ['VS-CoreDataset','VS-ExtendedDataset','VS-OccHealthCheck-Required',
                     'VS-PulmonaryFunction','VS-TWHAVitalSigns'];
          let s = fs.readFileSync('sushi-config.yaml','utf8');
          const before = s.split(/\r?\n/).length;
          s = s.split(/\r?\n/).filter(l => !B.some(v => l.includes(`/ValueSet/${v}`) && l.trim().startsWith('-'))).join('\n');
          fs.writeFileSync('sushi-config.yaml', s);
          console.log(`已移除 ${before - s.split(/\r?\n/).length} 行；保留 VS-UnfitDiseases（【A】類）`);
          EOF
          grep -A 8 'no-validate:' sushi-config.yaml

      - name: Run SUSHI
        run: npm run sushi

      # --repo/--target 啟用 -auto-ig-build，使 publish box 由「Local Development
      # build」改為 CI build 文案（JOB-02 驗收條件 #2）。網址由 github context 推導，
      # 不寫死；fork 或改名後仍然正確。
      - name: Run IG Publisher
        env:
          IG_REPO_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IG_TARGET_OUTPUT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/run-publisher.js --tx "$TX_SERVER" --publisher-version "$IG_PUBLISHER_VERSION"

      # ---------------------------------------------------------------- 閘門
      # 先上傳產出物，再跑閘門：閘門失敗時仍要能下載 qa.txt 診斷。
      - name: Upload QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ github.sha }}
          path: |
            output/qa.txt
            output/qa.html
            output/qa.json
            input-cache/publisher-run.log
          if-no-files-found: warn
          retention-days: 30

      # ig.ini 目前為 template = fhir2.base.template#current（未釘版），送審文件之
      # 建置輸入應可釘版。本步驟先把實際解析到的模板版本印出來，作為釘版依據——
      # 本機環境無法連線模板來源，不宜憑猜測寫入版本號（JOB-09）。
      - name: Report resolved template version
        if: always()
        run: |
          set -u
          echo "--- publisher 日誌中與 template 相關之行 ---"
          grep -iE 'template' input-cache/publisher-run.log | head -25 || echo "(日誌中查無 template 字樣)"

      # 把 JOB-02／JOB-03 的驗收條件固化為斷言，而非靠人工目視。
      # 語言目錄來自模板之 multilanguage-format: true（見 JOB-02 §3.3），
      # 故輸出必然落在語言子目錄；此處驗證它是 zh-TW 而非 en。
      # 刻意不使用 `set -e` 與 `cmd | head`：pipefail 下 head 提早關閉會讓上游收到
      # SIGPIPE 而使整步以 exit 2 失敗（第一版即因此誤報）。此處逐項判定後才決定結果。
      #
      # 佈局不預設：模板之 multilanguage-format: true 會產生語言子目錄，但仍以實際
      # 產出為準——先定位真正的內容首頁，再斷言「語言是 zh-TW」與「不存在 en/」，
      # 這兩項才是 JOB-02 的實質主張，且與佈局無關。
      - name: Verify publication layout
        run: |
          set -u
          echo "--- output/ 一層子目錄 ---"
          find output -mindepth 1 -maxdepth 1 -type d -printf '%f/\n' | sort
          echo "--- output/ 根層檔案數 ---"
          find output -mindepth 1 -maxdepth 1 -type f | wc -l
          echo "--- index.html 位置與大小 ---"
          find output -maxdepth 2 -name index.html -printf '%p  %s bytes\n' | sort

          fail=0

          # 定位內容首頁：語言子目錄優先；否則根目錄的 index.html 需夠大才算內容
          # （multilanguage 佈局下根目錄 index.html 是約 560 bytes 的轉址殼頁）。
          if [ -f output/zh-TW/index.html ]; then
            base=output/zh-TW
            echo "偵測到語言子目錄佈局：$base"
          elif [ -f output/index.html ] && [ "$(stat -c%s output/index.html)" -gt 2000 ]; then
            base=output
            echo "偵測到單語言根目錄佈局：$base"
          else
            echo "FAIL 找不到內容首頁（output/zh-TW/index.html 不存在，且 output/index.html 過小或不存在）"
            exit 1
          fi

          for f in index.html history.html ip-statements.html conformance.html; do
            if [ -f "$base/$f" ]; then
              echo "OK   $base/$f"
            else
              echo "FAIL $base/$f 不存在"; fail=1
            fi
          done

          if [ -d output/en ]; then
            echo "FAIL 仍存在 output/en——language: zh-TW 未生效"; fail=1
          else
            echo "OK   無 output/en"
          fi

          # 前導空白使其只取 lang= 而非 xml:lang=
          lang=$(grep -o '<html[^>]*>' "$base/index.html" | head -1 | grep -o ' lang="[^"]*"' | sed 's/ lang="//; s/"$//')
          echo "內容首頁 html lang = ${lang:-<未偵測到>}"
          if [ "$lang" != "zh-TW" ]; then
            echo "FAIL 預期 lang=zh-TW"; fail=1
          fi

          exit $fail

      # --expect-tx 要求日誌能證明確實連上術語伺服器。這道檢查獨立於
      # input/ignoreWarnings.txt——該抑制檔管不到 publisher 日誌，
      # 否則「連不上 tx」會與「通過驗證」外觀相同（見 JOB-09）。
      # 斷鏈是 IG Publisher 摘要行 `err = N` **未涵蓋**的類別（qa.txt 以 ERROR: 列出，
      # 但不計入 err），閘門原本對此完全盲目。已將 "cannot be resolved" 納入
      # qa-baseline.json 之具名類別追蹤；此處另列出目標網址分布，數字變動時才知道是哪一批。
      - name: Broken link breakdown
        if: always()
        run: |
          set -u
          [ -f output/qa.txt ] || { echo "(無 qa.txt)"; exit 0; }
          echo "斷鏈總數：$(grep -cE '^ERROR: .*cannot be resolved' output/qa.txt || echo 0)"
          echo "--- 目標網址分布 ---"
          grep -oE "The link '[^']+'" output/qa.txt | sort | uniq -c | sort -rn | head -10 || echo "(無)"

      # --expect-tx 要求日誌能證明確實連上術語伺服器。這道檢查獨立於
      # input/ignoreWarnings.txt——該抑制檔管不到 publisher 日誌，
      # 否則「連不上 tx」會與「通過驗證」外觀相同（見 JOB-09）。
      # JOB-05：MS 是對實作端的要求，宣告了卻沒有任何範例示範怎麼填，實作端無從照做，
      # 而 IG Publisher 不檢查這件事（它只檢查範例是否符合 profile）。
      # 目前不加 --strict——先讓缺口在每次建置中可見，補齊後再收緊為硬性條件。
      - name: Must Support 覆蓋檢核
        if: always()
        run: npm run check:ms

      # 翻譯字串閘門（JOB-24 §5）。**必須排在 IG Publisher 之後**——T-1／T-2 需要
      # 與模板之 stringsBase.json 比對，而該檔是 publisher 解壓 fhir2.base.template
      # 後才存在。排在前面會靜默跳過比對而假性通過。
      # 先跑負向測試再跑實檢，理由同 check:menu（比照 JOB-20／21／22／23）。
      - name: Check translation strings (self-test first)
        if: always()
        run: |
          npm run check:i18n:selftest
          npm run check:i18n

      # 比對表另存一份，供結尾之「QA gate summary」複述——見該步驟之說明。
      # 管線末端是 tee，預設會以 tee 的退出碼作為整條管線之結果，閘門失敗將被吞掉；
      # 故加 `set -o pipefail`，使 npm 的非零退出碼傳出，閘門失敗仍讓建置紅。
      - name: QA gate
        run: |
          set -o pipefail
          if [ "$TX_SERVER" = "n/a" ]; then
            echo "::warning::離線建置（-tx n/a），未經術語驗證，不得作為送審依據。"
            npm run qa -- --log input-cache/publisher-run.log 2>&1 | tee /tmp/qa-gate.txt
          else
            npm run qa -- --log input-cache/publisher-run.log --expect-tx 2>&1 | tee /tmp/qa-gate.txt
          fi

      # JOB-19 線 B（＋補充事項 §2／§3）：UCUM 建議單位稽核閘門（需 tx；離線建置略過）。
      #
      # 稽核全集＝**由值集展開**（VS-ExtendedDataset／CoreDataset／TWHAVitalSigns／
      # CoreUploadSet 之 Scale=Qn 碼），非讀 CSV 之列。舊版以 CSV 271 列為全集，而該檔
      # 凍結於 292 碼時期，致 20 個量值碼從未被 $lookup、閘門盲目——與 JOB-17 之
      # loinc-valuesets.xlsx 同型缺陷。此處沿用 JOB-17「由值集展開＋CI 攔阻」之模式。
      #
      # 兩道基準皆為 0：
      #   --max 0          不符（CSV 之單位有官方清單外者）
      #   --max-missing 0  未列於對照檔（值集有量值碼而 CSV 無——換碼後之涵蓋缺口）
      # 後者使下一次換碼若漏回寫對照檔，即於建置階段被自動發現。
      #
      # 三道基準（CI run 30534387613 實測後回填對照檔並恢復硬閘門）：
      #   --max 0          不符：CSV 之單位有官方 EXAMPLE_UCUM_UNITS 清單外者
      #   --max-missing 0  未列於對照檔：值集有量值碼而 CSV 無（換碼後之涵蓋缺口）
      #   --max-unknown 0  Scale 未知：三個未對映之答案清單碼已於 JOB-20 經 loinc.org 查證
      #                    （LP32888-7=Doc／LP436123-6=SemiQn／LP7747-1=-）並補入
      #                    SCALE_BY_LP，基準歸零（T-12 已結案）。新增未對映碼即失敗。
      #   --min-inscope-ratio 0.5
      #                    分類失效自我檢查（JOB-20 §5）：首輪曾因 Scale 判準錯誤而
      #                    「320 碼全判不適用」，三道零基準全為 0 而閘門空過（綠燈但一碼未驗）。
      #                    故對「納入比對之量值碼／全集」設 50% 下限：實測 241/320 = 75.3%，
      #                    留約 25 個百分點餘裕以容納值集組成之正常變動（新增定性碼會合理拉低
      #                    比率），而任何判準塌陷都會直接掉到接近 0 而被擋下。
      - name: UCUM 稽核閘門 (UCUM mismatch / 未列於對照檔 / Scale 未知)
        if: env.TX_SERVER != 'n/a'
        run: node scripts/audit-ucum.js --tx "$TX_SERVER" --gate --max 0 --max-missing 0 --max-unknown 0 --min-inscope-ratio 0.5

      # JOB-02 驗收條件 #2：publish box 不得再顯示 Local Development build。
      # 刻意排在 QA 閘門**之後**——閘門的數字是比較有診斷價值的訊號，
      # 就算本步驟失敗也要先把它記錄下來。本步驟失敗會使 job 失敗，
      # 因而不會上傳 site artifact，也就不會有東西可發佈——這是預期行為。
      - name: Verify publish box
        run: |
          set -u
          if [ -f output/zh-TW/index.html ]; then base=output/zh-TW; else base=output; fi

          box=$(grep -o '<p id="publish-box">.*</p>' "$base/index.html" | head -1)
          if [ -z "$box" ]; then
            echo "FAIL 在 $base/index.html 找不到 publish-box"; exit 1
          fi
          echo "publish box："
          echo "  $box" | sed 's/<[^>]*>//g' | cut -c1-300

          if printf '%s' "$box" | grep -q 'Local Development build'; then
            echo ""
            echo "FAIL publish box 仍為「Local Development build」。"
            echo "  應由 -auto-ig-build 切換為 CI build 文案；請確認 Run IG Publisher"
            echo "  步驟確實帶了 --repo 與 --target。"
            exit 1
          fi
          echo "OK   已非 Local Development build"

      - name: Upload built site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 14

      # 把 QA 閘門的比對表複述於 job 結尾，並寫入 job summary。
      #
      # 它是本建置最重要的產出，也是回填 qa-baseline.json 的唯一依據（見
      # docs/RELEASE.md §2.2：增量與降幅一律以 CI 實測為準，不得預先猜測）。但在原
      # 位置之後還有 UCUM 逐碼清單（320 行）與數千個檔案的 artifact 上傳日誌，往回捲
      # 很久才看得到；以日誌 API 取尾段時更是完全構不到，實測要回填時只能改用上一次
      # 失敗建置的數字——那正是「拿別次量測充當本次實測」的入口。故在此複述一次。
      - name: QA gate summary (repeat)
        if: always()
        run: |
          set -u
          if [ ! -f /tmp/qa-gate.txt ]; then
            echo "(無 QA 閘門輸出——建置在該步驟之前即中止)"
            exit 0
          fi
          cat /tmp/qa-gate.txt
          {
            echo '### QA 閘門比對表'
            echo ''
            echo '```'
            cat /tmp/qa-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ 一次性統計步驟（qa-baseline.json 之 _job29Note：cannot be resolved 之 24 筆未歸因）
      # ——**取得結果後即移除**。
      #
      # v0.4.0 新增 14 個物件，依既有規則（每件 10 筆）僅能解釋 140，實測 164，缺口 24。
      # 現有之「Broken link breakdown」只統計**目標網址**分布，不分來源頁，回答不了
      # 「哪些頁面多產生了斷鏈」。本步驟改以**來源頁名**分群清點。
      #
      # 假說：ValueSet 之輸出頁數多於 CodeSystem（每件 14 而非 10），
      #       6×10 ＋ 6×14 ＋ 2×10 = 164 恰好相符。本步驟即為驗證或推翻該假說。
      #
      # ⚠️ 位置固定在 job 結尾（診斷輸出要放在讀得到的地方）；輸出經彙總，不逐行傾印。
      - name: '[one-shot] cannot-be-resolved by source page (qa-baseline _job29Note)'
        if: always()
        run: |
          set -u
          f=output/qa.txt
          [ -f "$f" ] || { echo "MARKER-NO-QA 找不到 $f（建置未產生）"; exit 0; }
          node - "$f" <<'EOF'
          const fs = require('fs');
          const lines = fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/);
          // ⚠️ 以「取到第一個點為止」作為 artifact 基底，**不可**列舉已知的渲染變體後綴：
          // 負向測試證實，若採列舉法（.html／.json.html／.xml.html／.ttl.html／
          // .change.history.html），遇到未列舉之變體（如 .expansion.html）會把同一個
          // artifact 拆成數個基底，每件平均值因而失真——而「是否存在額外變體」正是
          // 本步驟要回答的問題，列舉法等於先把答案藏起來。本 IG 之 artifact id 不含點。
          const baseOf = (page) => page.split('.')[0];
          const perPage = new Map();   // 完整頁名 -> 筆數
          const perBase = new Map();   // 去掉渲染變體後之 artifact -> 筆數
          let total = 0, unparsed = 0;
          for (const l of lines) {
            if (!l.includes('cannot be resolved')) continue;
            total++;
            const m = l.match(/^ERROR:\s+(\S+?)#/);
            if (!m) { unparsed++; continue; }
            const page = m[1];
            const base = baseOf(page);
            perPage.set(page, (perPage.get(page) || 0) + 1);
            perBase.set(base, (perBase.get(base) || 0) + 1);
          }
          console.log('MARKER-TOTAL', total, ' 無法解析頁名:', unparsed);
          console.log('MARKER-DISTINCT-BASE', perBase.size, ' DISTINCT-PAGE', perPage.size);

          // 依 artifact 型別彙總（每件平均筆數即為「每件 N 筆」規則之實測值）
          const byType = new Map();
          for (const [base, n] of perBase) {
            const t = (base.match(/^([A-Za-z]+)-/) || [, '(其他)'])[1];
            const e = byType.get(t) || { files: 0, hits: 0 };
            e.files++; e.hits += n; byType.set(t, e);
          }
          console.log('MARKER-BY-TYPE  型別 / artifact 數 / 斷鏈數 / 每件平均');
          for (const [t, e] of [...byType].sort((a, b) => b[1].hits - a[1].hits)) {
            console.log(`  ${t.padEnd(24)} ${String(e.files).padStart(4)} ${String(e.hits).padStart(6)}   ${(e.hits / e.files).toFixed(2)}`);
          }

          // v0.4.0 新增之物件逐件列出
          const NEW = /BetelNut|betelnut|TimeUnitYearMonth/i;
          const news = [...perBase].filter(([b]) => NEW.test(b)).sort();
          console.log('MARKER-NEW-ARTIFACTS 共', news.length, '件，合計',
                      news.reduce((s, [, n]) => s + n, 0), '筆');
          for (const [b, n] of news) console.log(`  ${b.padEnd(46)} ${String(n).padStart(4)}`);

          // 假說驗證：CodeSystem 與 ValueSet 各自之渲染變體
          for (const probe of ['CodeSystem-CS-BetelNutStatus', 'ValueSet-VS-BetelNutStatus']) {
            const v = [...perPage].filter(([p]) => baseOf(p) === probe).sort();
            console.log(`MARKER-VARIANTS ${probe} → ${v.length} 種頁面`);
            for (const [p, n] of v) console.log(`    ${p}  ${n}`);
          }
          EOF

  # ==================================================================== 發佈
  # JOB-08 第二階段。**預設不會自動執行**：
  #
  #   - workflow_dispatch 且勾選 publish  → 執行（手動發佈）
  #   - push 至 main 且 repo variable AUTO_PUBLISH_PAGES == 'true' → 執行（持續發佈）
  #   - 其餘（含一般 PR、未設變數的 main push） → 略過
  #
  # 這樣「合併」與「發佈」是兩個各自獨立的決定：合併 PR 不會動到線上網站，
  # 要發佈時才按 Actions → Run workflow 並勾選 publish。確認手動發佈無誤後，
  # 再到 Settings → Secrets and variables → Actions → Variables 新增
  # AUTO_PUBLISH_PAGES = true，即轉為每次 main 有更新就自動發佈。
  # （JOB-08 §6 之計畫要求「先以 workflow_dispatch 手動驗證再改自動」。）
  #
  # needs: build 使閘門成為發佈的前置條件——QA 閘門失敗就不會有東西被推上去。
  publish:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_PUBLISH_PAGES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 只有這個 job 需要寫入權限；build job 維持唯讀。
    permissions:
      contents: write

    # 不與其他發佈並行，且**不可** cancel-in-progress：中途取消會讓 gh-pages
    # 停在只刪不補的狀態。
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false

    steps:
      # 發佈的是 build job 閘門通過的那一份輸出，不重新建置——
      # 重建可能因上游套件變動而產出與受檢版本不同的內容。
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      # 全量覆蓋，不是增量推送。現行 gh-pages 有 1012 個根目錄轉址殼頁與一個
      # en/ 目錄；JOB-02 改為 zh-TW/ 後，增量推送會把這些孤兒檔案永久留在站上。
      # en/ 轉址經確認不保留（JOB-08 §5「尚未做」條目），故舊網址將失效。
      - name: Replace site content
        run: |
          set -euo pipefail

          echo "--- 發佈前 gh-pages 內容 ---"
          find gh-pages -mindepth 1 -maxdepth 1 -not -name .git -printf '%f\n' | sort | head -20 || true
          echo "檔案總數：$(find gh-pages -type f -not -path '*/.git/*' | wc -l)"

          # 保留 .git，其餘全部清除
          find gh-pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

          cp -a site/. gh-pages/

          # GitHub Pages 預設會對 gh-pages 跑 Jekyll，底線開頭的檔案與目錄會被略過。
          # IG Publisher 的輸出不是 Jekyll 專案（Jekyll 在建置階段就已跑過），
          # 故明確關閉。
          touch gh-pages/.nojekyll

          echo "--- 發佈後內容 ---"
          find gh-pages -mindepth 1 -maxdepth 1 -not -name .git -printf '%f\n' | sort | head -20 || true
          echo "檔案總數：$(find gh-pages -type f -not -path '*/.git/*' | wc -l)"

      # 讓線上網站能自證來源：出問題時可直接對回某個 commit 與某次 CI 執行，
      # 不必猜「站上這版是從哪裡建的」（JOB-08 §5「發佈內容記錄來源 commit」）。
      - name: Write build provenance
        run: |
          set -euo pipefail
          cat > gh-pages/build-info.json <<JSON
          {
            "sourceCommit": "${{ github.sha }}",
            "sourceRef": "${{ github.ref }}",
            "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "igPublisherVersion": "${{ needs.build.outputs.publisher-version }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "note": "本站由 CI 自動發佈。內容為研擬中之草案，不得作為實作依據。"
          }
          JSON
          cat gh-pages/build-info.json

      # 發佈前最後一道確認：內容首頁存在、語言正確、舊的 en/ 已不存在。
      # 這與 build job 的 Verify publication layout 是同一組主張，但驗的是
      # **即將上線的那份檔案**——複製或清除若出錯，這裡才擋得住。
      - name: Verify content before publish
        run: |
          set -u
          fail=0

          if [ -f gh-pages/zh-TW/index.html ]; then
            base=gh-pages/zh-TW
          elif [ -f gh-pages/index.html ] && [ "$(stat -c%s gh-pages/index.html)" -gt 2000 ]; then
            base=gh-pages
          else
            echo "FAIL 找不到內容首頁，拒絕發佈"; exit 1
          fi
          echo "OK   內容首頁：$base/index.html"

          if [ -d gh-pages/en ]; then
            echo "FAIL 仍存在 en/——舊內容未清除乾淨"; fail=1
          fi

          lang=$(grep -o '<html[^>]*>' "$base/index.html" | head -1 | grep -o ' lang="[^"]*"' | sed 's/ lang="//; s/"$//')
          echo "內容首頁 html lang = ${lang:-<未偵測到>}"
          [ "$lang" = "zh-TW" ] || { echo "FAIL 預期 lang=zh-TW"; fail=1; }

          # 根目錄必須有可導向內容的 index.html（multilanguage 佈局下為轉址殼頁）
          [ -f gh-pages/index.html ] || { echo "FAIL 根目錄無 index.html，站台首頁會 404"; fail=1; }

          exit $fail

      - name: Commit and push
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "內容與現行 gh-pages 完全相同，無需發佈。"
            exit 0
          fi
          echo "--- 變更統計 ---"
          git diff --cached --shortstat
          git commit -q -m "publish: ${{ github.sha }} (run ${{ github.run_id }})"
          git push origin gh-pages

      - name: Summary
        if: success()
        run: |
          {
            echo "### 已發佈至 gh-pages"
            echo ""
            echo "- 來源 commit：\`${{ github.sha }}\`"
            echo "- 網站：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo ""
            echo "⚠️ 舊網址 \`/en/…\` 已失效——JOB-02 將輸出語言目錄由 \`en/\` 改為 \`zh-TW/\`，"
            echo "且經確認不保留轉址。已把舊網址發給審閱者時，請一併通知改用網站根網址。"
          } >> "$GITHUB_STEP_SUMMARY"
